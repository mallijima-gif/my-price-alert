name: Trading Room Cloud Price Alerts

on:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    paths:
      - 'trading-room/state.enc'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-room-cloud-price-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install alert dependencies
        run: python -m pip install 'cryptography==46.0.5'
      - name: Monitor encrypted Trading Room alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRADING_ROOM_ALERT_KEY: ${{ secrets.TRADING_ROOM_ALERT_KEY }}
          TRADING_ROOM_TELEGRAM: ${{ secrets.TRADING_ROOM_TELEGRAM }}
        run: python -m chart_scanner.alert_cloud --worker

